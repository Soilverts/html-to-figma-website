<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#091422;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)" />

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top left: brand mark -->
  <text x="80" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38BDF8" letter-spacing="1">HTML TO FIGMA</text>

  <!-- Category label -->
  <rect x="80" y="108" width="110" height="28" rx="14" fill="#38BDF8" opacity="0.2" />
  <text x="96" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" letter-spacing="0.5">GUIDE 2026</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Best Figma Plugins</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-2">for Developers</text>
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#38BDF8" letter-spacing="-2">in 2026</text>

  <!-- Subtitle -->
  <text x="80" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)">Code-to-design · Design tokens · Accessibility · Version control</text>

  <!-- Plugin category pills -->
  <rect x="80" y="498" width="168" height="36" rx="18" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="164" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">html2design #1</text>

  <rect x="264" y="498" width="160" height="36" rx="18" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="344" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle">Tokens Studio</text>

  <rect x="440" y="498" width="126" height="36" rx="18" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="503" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle">Dev Mode</text>

  <rect x="582" y="498" width="100" height="36" rx="18" fill="rgba(251,146,60,0.15)" stroke="rgba(251,146,60,0.3)" stroke-width="1"/>
  <text x="632" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FB923C" text-anchor="middle">A11y</text>

  <!-- Right side decorative element -->
  <rect x="880" y="160" width="240" height="300" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="1000" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">5 CATEGORIES</text>
  <text x="1000" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Code → Figma</text>
  <text x="1000" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Figma → Code</text>
  <text x="1000" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Design Tokens</text>
  <text x="1000" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Accessibility</text>
  <text x="1000" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Version Control</text>

  <!-- Bottom URL -->
  <text x="80" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.3)" letter-spacing="0.5">html2design.com/blog/figma-plugins-for-developers</text>
</svg>

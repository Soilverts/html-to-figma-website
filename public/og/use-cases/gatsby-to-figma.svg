<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#120720;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#663399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#663399;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)" />

  <!-- Grid pattern overlay -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top left: brand mark -->
  <text x="80" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#663399" letter-spacing="1">HTML TO FIGMA</text>

  <!-- Category label -->
  <rect x="80" y="108" width="104" height="28" rx="14" fill="#663399" opacity="0.2" />
  <text x="96" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#663399" letter-spacing="0.5">USE CASE</text>

  <!-- Main title -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white" letter-spacing="-1">
    <tspan x="80" y="240">Gatsby to Figma</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)" font-weight="400">Convert Gatsby site components to Figma designs</text>

  <!-- Bottom: URL -->
  <text x="80" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="rgba(255,255,255,0.4)">htmltofigma.io</text>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="180" fill="#663399" opacity="0.08" />
  <circle cx="1050" cy="500" r="120" fill="#663399" opacity="0.05" />
  <circle cx="1150" cy="350" r="80" fill="white" opacity="0.03" />
</svg>